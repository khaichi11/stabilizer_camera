name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/firmware.yml"
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compile ESP32-C3 (Arduino CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The app inside the firmware matches docs/
        run: python3 tools/embed_web.py --check
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core list
      - name: Compile (Huge APP partition, USB CDC on boot)
        run: >
          arduino-cli compile
          --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=huge_app"
          --warnings all
          firmware/D435_gimbal_ESP32C3
      - name: Does it also fit the default partition? (not required, the app files need Huge APP)
        continue-on-error: true
        run: arduino-cli compile --fqbn "esp32:esp32:esp32c3:CDCOnBoot=cdc" firmware/D435_gimbal_ESP32C3

  simulate:
    name: Physics simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        working-directory: firmware/uji_simulasi
        run: |
          g++ -std=gnu++17 -O2 -Wall -Wextra -Wno-unused-parameter -I mock -include array sim.cpp -o sim
          ./sim
          echo "== other servos (summary only)"
          for v in "SRV_TAU=15 SRV_DB=6" "SRV_TAU=40 SRV_DB=20" "SRV_TAU=60" "BACKLASH=0.6" "GAIT_JIT=0.04" "WALK_F=2.8 WALK_AMP=2.5 HEEL=3" "GAIT=0"; do
            echo "$v: $(env $v QUICK=1 ./sim | grep SUMMARY)"
          done
